[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "infinitum"
version = "0.2.8"
description = "Persistent memory and context runtime for AI agents and LLMs with an OpenAI-compatible API."
readme = "README.md"
requires-python = ">=3.12"
authors = [{name = "Infinitum Contributors"}]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "pydantic>=2.8",
  "PyYAML>=6.0",
  "numpy>=2.0",
  "orjson>=3.10",
]

[project.optional-dependencies]
tokenizer = ["tiktoken>=0.8"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
]

[project.scripts]
infinitum = "infinitum.__main__:main"
# Compatibility alias for pre-0.2 installs.
context-runtime = "infinitum.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/infinitum", "src/context_runtime"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
