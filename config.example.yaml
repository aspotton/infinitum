# Infinitum — minimal starter config.
#
# This is all you need to run. Every other key has a tuned default baked into
# the program, so you only ever write down what you want to change.
#
# passthrough_authorization is already ON by default, so the inbound
# Authorization header is forwarded to the upstream and nothing else is required
# to run. Set api_key only when the upstream needs a fixed key of its own.

upstream:
  base_url: http://localhost:4000/v1
  api_key: ${UPSTREAM_API_KEY:-}

# --- Optional: a custom database location -----------------------------------
# Override the default ./infinitum.db. Container users pin it to /db/infinitum.db
# via INFINITUM_DATABASE_PATH; the ${VAR:-default} form falls back when unset.
# memory:
#   database_path: ${INFINITUM_DATABASE_PATH:-./infinitum.db}

# --- Optional: embeddings (opt-in, off by default) --------------------------
# Enables semantic similarity for retrieval and reinforcement. Leave disabled to
# run lexical-only with no extra service.
# embeddings:
#   enabled: false
#   base_url: http://localhost:8000/v1
#   model: text-embedding-3-small

# --- Optional: a separate learning model ------------------------------------
# By default background learning reuses the request's model and upstream.base_url.
# Point these at a cheaper/faster model to decouple extraction from the proxy.
# learning:
#   model: ""
#   base_url: ""
#   api_key: ${LEARNING_API_KEY:-}

# --- Optional: vendor knobs for background learning -------------------------
# tool_choice: none is ALREADY the default here, so it need not be repeated.
# The opt-in addition is chat_template_kwargs to disable thinking on reasoning
# servers during extraction:
# learning:
#   extra_body:
#     chat_template_kwargs:
#       enable_thinking: false

# Every other key has a tuned default — the full reference table is in
# docs/CONFIGURATION.md#defaults-at-a-glance
